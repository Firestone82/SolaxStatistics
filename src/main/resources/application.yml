solax:
  url:
    # Login page, the application URL (e.g. https://global.solaxcloud.com/blue/) is taken from the redirect after login
    portal: "https://www.solaxcloud.com/user-center/"
  # Run Chrome without a window
  headless: false
  credentials:
    username: "YOUR_USERNAME"
    password: "YOUR_PASSWORD"

# Spot electricity prices (OTE), scraped from the quarter-hour day pages {baseUrl}/denni-ceny/{yyyy-MM-dd}
ote:
  baseUrl: "https://spotovaelektrina.cz"

cez:
  url:
    # PND portal, redirects to the ČEZ (CAS) login
    portal: "https://pnd.cezdistribuce.cz/cezpnd2/external/dashboard/view"
    export: "https://pnd.cezdistribuce.cz/cezpnd2/external/data/export"
  # Run Chrome without a window
  headless: true
  meterId: 123456789
  credentials:
    username: "YOUR_USERNAME"
    password: "YOUR_PASSWORD"
  tariff:
    # Prices per kWh
    importPrice:
      eur: 0.3
      czk: 7.5
    exportFee:
      czk: 0.5
      eur: 0.02

data:
  # Path to the directory where the data will be stored
  directory: "data"

summary:
  # Months processed on startup (yyyy-MM, e.g. "2025-09"). Empty "from" processes the previous month,
  # empty "to" processes only the "from" month. Can also be passed as arguments: --summary.from=2025-09
  from: ""
  to: ""

email:
  # Send the summary email with the Excel file attached after processing a month
  enabled: false
  sender: "your-sender@domain.com"
  # Who gets the summary and in which template from resources/templates:
  # energy-report.html (English) or energy-report-cs.html (Czech)
  recipients:
    - address: "your-recipient@domain.com"
      template: "energy-report.html"
    - address: "your-czech-recipient@domain.com"
      template: "energy-report-cs.html"

spring:
  mail:
    host: "YOUR_HOST"
    port: 465
    username: "YOUR_USERNAME"
    password: "YOUR_PASSWORD"
    properties:
      mail:
        smtp:
          auth: true
    ssl:
      enabled: true

# Logging configuration
logging:
  config: classpath:log4j2.xml
  level:
    me.firestone82.solaxstatistics: TRACE